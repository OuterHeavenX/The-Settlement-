<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Architecture Sprite QA Gallery</title>
<style>html,body{margin:0;background:#17151b;color:#f1dfb4;font:14px Georgia,serif}header{padding:18px;text-align:center}header b{font-size:20px}.note{color:#bda980;margin-top:6px}canvas{display:block;margin:0 auto 32px;max-width:100%;height:auto;background:#211e23}</style>
<header><b>THE SETTLEMENT · HIGH-FIDELITY ARCHITECTURE QA</b><div class="note">Levels 1 / 3 / 5 / 10. Missing sprite assets deliberately fall back to Architecture2D.</div></header>
<canvas id="gallery" width="1200" height="1500"></canvas>
<script>window.Settlement={Config:{TILE:64},BuildingDefs:{cottage:{category:'Residential'},mainHall:{category:'Civic'},archery:{category:'Military'},training:{category:'Military'},bakery:{category:'Production'},mill:{category:'Production'},blacksmith:{category:'Production'},warehouse:{category:'Production'},quarry:{category:'Production'},lumber:{category:'Production'}},CivilizationEras:{current:g=>({id:g._era||'settlement'})}}</script>
<script src="../src/data/buildingSpriteManifest.js"></script>
<script src="../src/rendering/Architecture2D.js"></script>
<script src="../src/rendering/BuildingSpriteRenderer.js"></script>
<script>
const canvas=document.querySelector('#gallery'),ctx=canvas.getContext('2d'),levels=[1,3,5,10],tiers=['BASIC · LV 1','ESTABLISHED · LV 3','ADVANCED · LV 5','MASTER · LV 10'],eras=['settlement','village','walledTown','greatCity'],types=['cottage','mainHall','archery','training','bakery','mill','blacksmith','warehouse','quarry','lumber'];
const game={quality:{tier:'ULTRA'},_era:'settlement',cityEra:{current(){return{id:game._era}}},farms:{normalize:()=>({state:'empty'})}},renderer={game,ctx},fallback=new Settlement.Architecture2D(renderer),sprites=new Settlement.BuildingSpriteRenderer(renderer);
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#211e23';ctx.fillRect(0,0,canvas.width,canvas.height);for(let col=0;col<4;col++){let cx=20+col*295;ctx.fillStyle='#302c31';ctx.fillRect(cx,10,280,1480);ctx.textAlign='center';ctx.fillStyle='#f1dfb4';ctx.font='bold 16px Georgia';ctx.fillText(tiers[col],cx+140,38);ctx.fillStyle='#bda980';ctx.font='11px Georgia';ctx.fillText(eras[col].toUpperCase(),cx+140,56);game._era=eras[col];for(let row=0;row<types.length;row++){let type=types[row],x=cx+42,y=72+row*139,w=196,h=112,b={type,level:levels[col],w:w/64,h:h/64,id:row+1};let ok=sprites.draw(b,x,y,w,h,1);if(!ok)fallback.draw(b,x,y,w,h);ctx.fillStyle=ok?'#d8c276':'#9c8f83';ctx.font='bold 11px Georgia';ctx.fillText(type.toUpperCase()+(ok?' · SPRITE':' · FALLBACK'),cx+140,y+125)}}}
draw();setInterval(draw,700);
</script>
