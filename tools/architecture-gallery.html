<!doctype html>
<meta charset="utf-8">
<title>Architecture evolution gallery</title>
<style>html,body{margin:0;background:#17151b;color:#f1dfb4;font:14px Georgia}canvas{display:block;margin:auto;max-width:100%;height:auto}</style>
<canvas id="gallery" width="1120" height="790"></canvas>
<script>window.Settlement={Config:{TILE:64},BuildingDefs:{cottage:{category:"Residential"},mainHall:{category:"Civic"},archery:{category:"Military"},bakery:{category:"Production"},blacksmith:{category:"Production"},mill:{category:"Production"}}}</script>
<script src="../src/rendering/Architecture2D.js"></script>
<script>
const canvas=document.querySelector("canvas"),ctx=canvas.getContext("2d"),stages=["settlement","village","walledTown","greatCity"],levels=[1,3,5,10],types=["cottage","mainHall","archery","bakery","blacksmith","mill"],labels=["BASIC · LV 1","ESTABLISHED · LV 3","ADVANCED · LV 5","MASTER · LV 10"];
const game={quality:{tier:"ULTRA"},cityEra:{current:()=>({id:stages[column]})},farms:{normalize:()=>({state:"empty"})}},renderer={game,ctx},art=new Settlement.Architecture2D(renderer);let column=0;
ctx.fillStyle="#242126";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign="center";
for(column=0;column<4;column++){ctx.fillStyle="#302c31";ctx.fillRect(15+column*275,15,265,760);ctx.fillStyle="#f1dfb4";ctx.font="bold 17px Georgia";ctx.fillText(labels[column],147+column*275,43);ctx.font="12px Georgia";ctx.fillStyle="#bda980";ctx.fillText(stages[column].toUpperCase(),147+column*275,63);for(let row=0;row<types.length;row++){let type=types[row],x=62+column*275,y=78+row*115,w=170,h=105,b={type,level:levels[column],w:w/64,h:h/64};art.draw(b,x,y,w,h);ctx.fillStyle="#f4e5c7";ctx.font="bold 12px Georgia";ctx.fillText(type.toUpperCase(),147+column*275,y+105)}}
</script>
